[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-lifecycle"
dynamic = ["version"]
description = "Agentic engineering lifecycle framework for OpenCode: agents, skills, gates, and an agent-immutable enforcement plane."
readme = "framework/docs/README.md"
requires-python = ">=3.11"
authors = [{ name = "Rajesh P" }]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
framework = "framework.cli:main"

[project.urls]
Repository = "https://github.com/rajeshp26/agentic-lifecycle"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "framework.__version__"}

# Discover every real subpackage under framework/ (framework, framework.claims, framework.retro,
# framework.contracts, framework.adapters.hosts, framework.opencode, ...). namespaces=false keeps
# data-only subdirectories (gates/, models/, opencode/skills/, ...) OUT of the package set so their
# files ship as package data rather than as empty namespace packages.
[tool.setuptools.packages.find]
include = ["framework*"]
namespaces = false

# Non-.py runtime data. Gates are bash, the surface is Markdown/TypeScript; none is importable,
# all of it is required at runtime. `framework.opencode` is the relocated surface, shipped whole.
[tool.setuptools.package-data]
framework = ["**/*.json", "**/*.yaml", "**/*.yml", "**/*.sh", "**/*.md", "**/*.txt", "**/*.ts", "**/*.tsx", "**/*.css", "**/*.html", "**/*.py", "**/*.mjs", "**/*.js", "**/*.cjs", "**/Dockerfile"]
"framework.opencode" = ["**/*"]

# Pin the exact rule set the framework lint baseline was built against. Without this,
# ruff's default `select` changes between releases: ruff 0.15.18 reported E4/E7/E9/F
# (119 findings) while 0.17.1 reported 1185 findings across a much broader default set,
# so the version guard in framework/tools/lint_budget.py could not compare budgets and a
# refresh would have silently changed what the ratchet enforces. Declaring the selection
# makes the budget portable across ruff versions; the baseline records only the tool
# version from here on.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# Canonical suites: framework contract tests + consolidated backend tests.
# The framework-owned reference app lives under framework/reference-app/ and is exercised by
# `framework standalone` (its own staged venv), never by the repository pytest run: its contract
# test imports `src.backend`, which only resolves inside the staged application.
testpaths = ["framework/contracts", "backend/tests"]
norecursedirs = [".*", "node_modules", "dist", "build", "backend/scripts", "docs",
                 "framework/reference-app", "backend/tests/system"]