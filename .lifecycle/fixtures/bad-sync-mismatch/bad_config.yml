# .lifecycle/config.yml
# Project instantiation of FEATURE_DEVELOPMENT_LIFECYCLE.md v1.1
# Reference instantiation: GM Entertainment Product — generic Audio Settings slice.
#
# NORMATIVE SHAPE: see spec §1.3. Phases and gates are SEPARATE lists (§3.4 Rule D3).

spec_version: "1.1"

project:
  id: entertainment-audio
  name: "Entertainment — Audio Settings"
  domains: [hmi, apps, business-logic, platform, hal, backend, database, external]
  safety_relevant: false          # individual features may floor to L4; see depth_floors
  regulatory_scope: []            # e.g. [GDPR] where per-user audio profiles sync to backend

# ---------------------------------------------------------------------------
# Layers — the seams this project's features cross.
# process_boundary: true means a call leaves the process; §6.4.1 forbids marking
# timeout inapplicable on these without surviving review.
# ---------------------------------------------------------------------------
layers:
  hmi:
    description: "Audio Settings screens, controls, and their view models"
    process_boundary: false
  audio_service:
    description: "GM Audio Service — settings orchestration and policy"
    process_boundary: true
    boundary_kind: ipc
  audio_hal:
    description: "Audio HAL and AIDL extensions; proxies control calls outward"
    process_boundary: true
    boundary_kind: ipc
  vacs:
    description: "Vehicle Audio Control System — centralized arbitrator, separate OS"
    process_boundary: true
    boundary_kind: ipc
  audio_hub:
    description: "Audio Hub — routing and mixing endpoints"
    process_boundary: true
    boundary_kind: ipc
  persistence:
    description: "Settings repository — per-vehicle, per-seat and per-user values"
    process_boundary: false
  backend_sync:
    description: "Account-scoped settings synchronization"
    process_boundary: true
    boundary_kind: network

# ---------------------------------------------------------------------------
# Control scopes — the authority model a settings AC-* must name (§6.5).
# ---------------------------------------------------------------------------
control_scopes:
  vehicle:
    label: "Car Control"
    persistence: per_vehicle
    authority: "any authorized occupant; last writer wins"
    conflict_window: none
  seat:
    label: "Seat Control"
    persistence: per_seat
    authority: "the occupant of that seat"
    conflict_window: none
  shared_vehicle:
    label: "Shared Car Control"
    persistence: per_vehicle
    authority: "driver may override; co-pilot may set within driver-granted limits"
    conflict_window: "arbitration required; see §6.6 concurrency model"

user_roles: [driver, co_pilot, normal, kids, guest]

# ---------------------------------------------------------------------------
# ID prefixes (§1.3)
# ---------------------------------------------------------------------------
id_prefixes:
  customer: CUS
  journey: JRN
  use_case: UC
  scenario: SCN
  story: US
  acceptance: AC
  nfr: NFR
  component: CMP
  interface: IFC
  event: EVT
  design: DES
  unit: IMP
  test_condition: TC
  test_unit: UT
  test_integration: IT
  test_system: ST
  test_validation: VT
  defect: DEF
  escape: ESC
  risk: RSK
  baseline: BL

# ---------------------------------------------------------------------------
# DEPTHS — phases and gates are separate lists (§3.4).
# v1.1 change: G0.5 present at L1 (Rule D1); F8/F9 present at L2 abbreviated
# (Rule D2), which is why L2 also carries G3.
# ---------------------------------------------------------------------------
depths:
  L0:
    phases: [F12, F13]
    gates:  [G4]
  L1:
    phases: [F0, F3, F5, F10, F12, F13, F14]
    gates:  [G0, "G0.5", G2, G4, G7]
    notes: "G0.5 mandatory because F5 is performed (Rule D1). Technique block scoped 'as applicable'."
  L2:
    phases: [F0, F1, F2, F3, F4, F5, F6, F7, F8, F9, F10, F12, F13, F14, F15]
    gates:  [G0, "G0.5", G1, G2, G3, G4, G7]
    abbreviated: [F8, F9]          # one page each (Rule D2); no alternatives record
  L3:
    phases: [F0, F1, F2, F3, F4, F5, F6, F7, F8, F9, F10, F11, F12, F13, F14, F15, F16, F17]
    gates:  [G0, "G0.5", G1, G2, G3, "G3.5", G4, G5, G6, G7, G8]
    ui_gates_conditional: [G5, G6]  # apply only when the feature has a UI surface
  L4:
    phases: [F0, F1, F2, F3, F4, F5, F6, F7, F8, F9, F10, F11, F12, F13, F14, F15, F16, F17]
    gates:  [G0, "G0.5", G1, G2, G3, "G3.5", G4, G5, G6, G7, G8]
    ui_gates_conditional: [G5, G6]
    risk_controls: true             # §11
    independence: role_and_identity # §9.1.1 stricter rule

rules:
  gates_must_be_subset_of_phase_requirements: true
  required_gate_missing: BLOCK
  g0_5_mandatory_when_f5_performed: true
  independence: identity            # identity | role_and_identity (L4 forces the latter)
  ambiguity_resolves: upward
  de_escalation_requires_reviewer_concurrence: true

# ---------------------------------------------------------------------------
# Scenario classes (§5.2.2) — SINGLE SOURCE OF TRUTH for the class enum
# in trace.schema.json. Must match exactly (values AND order).
# ---------------------------------------------------------------------------
scenario_classes: [fakeclass, normal, alternate, negative, failure, recovery, interrupted,
                   repeated, boundary, concurrent, persistence, upgrade,
                   downgrade, rollback, security, performance, safety, misuse,
                   unexpected_sequence]

# ---------------------------------------------------------------------------
# State machine (§7) — legal transitions and gate prerequisites.
# "*" is the wildcard for DEFECT_LOOP reentry.
# ---------------------------------------------------------------------------
state_machine:
  legal_transitions:
    - { from: "-", to: QUALIFIED }
    - { from: QUALIFIED, to: UNDERSTANDING }
    - { from: UNDERSTANDING, to: SCENARIOS_MODELLED }
    - { from: SCENARIOS_MODELLED, to: REQUIREMENTS_DRAFTED }
    - { from: REQUIREMENTS_DRAFTED, to: REQUIREMENTS_CHALLENGED }
    - { from: REQUIREMENTS_CHALLENGED, to: REQUIREMENTS_DRAFTED }
    - { from: REQUIREMENTS_CHALLENGED, to: REQUIREMENTS_BASELINED }
    - { from: REQUIREMENTS_BASELINED, to: DECOMPOSED }
    - { from: REQUIREMENTS_BASELINED, to: TEST_ANALYSED }
    - { from: DECOMPOSED, to: CONTRACTED }
    - { from: CONTRACTED, to: ARCHITECTED }
    - { from: ARCHITECTED, to: DESIGNED }
    - { from: DESIGNED, to: IMPACT_ASSESSED }
    - { from: IMPACT_ASSESSED, to: DESIGN_REVIEWED }
    - { from: IMPACT_ASSESSED, to: IMPLEMENTING }
    - { from: TEST_ANALYSED, to: TEST_DESIGNED }
    - { from: TEST_DESIGNED, to: REGRESSION_SELECTED }
    - { from: REGRESSION_SELECTED, to: EXECUTION_READY }
    - { from: DESIGN_REVIEWED, to: IMPLEMENTING }
    - { from: IMPLEMENTING, to: UNIT_VERIFIED }
    - { from: UNIT_VERIFIED, to: INTEGRATION_VERIFIED }
    - { from: INTEGRATION_VERIFIED, to: SYSTEM_VERIFIED }
    - { from: SYSTEM_VERIFIED, to: VALIDATION_READY }
    - { from: EXECUTION_READY, to: VALIDATION_READY }
    - { from: VALIDATION_READY, to: VALIDATED }
    - { from: VALIDATED, to: VALIDATION_ACCEPTED }
    - { from: VALIDATION_ACCEPTED, to: RELEASE_PENDING }
    - { from: RELEASE_PENDING, to: COMPLETE }
    - { from: "*", to: DEFECT_LOOP }
    - { from: DEFECT_LOOP, to: "*" }
  gate_prerequisites:
    REQUIREMENTS_BASELINED: [G0, "G0.5"]
    CONTRACTED: [G1]
    ARCHITECTED: [G3]
    IMPACT_ASSESSED: [G2]
    DESIGN_REVIEWED: ["G3.5"]
    UNIT_VERIFIED: [G4]
    SYSTEM_VERIFIED: [G7]
    VALIDATION_READY: ["G8-A"]
    VALIDATION_ACCEPTED: ["G8-B"]

# ---------------------------------------------------------------------------
# Project-specific depth floors — tightening only (§3.3 permits tightening,
# never silent loosening). These are judgment about the audio domain, not spec text.
# ---------------------------------------------------------------------------
depth_floors:
  - trigger: "audio focus or ducking behaviour changes"
    floor: L3
    reason: "focus arbitration crosses HMI, service, HAL and VACS; regressions are cross-feature"
  - trigger: "alert, chime or warning audibility affected"
    floor: L4
    reason: "audibility of a warning is a safety-relevant outcome; §11 hazard and misuse analysis applies"
  - trigger: "control scope of an existing setting changes"
    floor: L3
    reason: "changes the authority model; existing per-seat or per-vehicle expectations break silently"
  - trigger: "per-user persistence or backend account sync affected"
    floor: L3
    reason: "concurrent device and backend modification; §6.6 conflict resolution mandatory"

gates:
  self_certification: forbidden
  ledger_required: true
  conditional_forbidden_at: [G0, "G0.5", G7, G8]
  conditional_forbidden_at_depth: [L4]
  ledger_path: "features/<FEATURE-ID>/gates/<GATE-ID>.md"

# ---------------------------------------------------------------------------
# Risk scoring (§5.2.2). priority = likelihood * impact * (6 - detectability)
# ---------------------------------------------------------------------------
priority:
  formula: "likelihood * impact * (6 - detectability)"
  scales:
    likelihood: [1, 5]
    impact: [1, 5]
    detectability: [1, 5]         # 5 = easily detected, so (6 - d) rewards low detectability
  bands:
    low:      { min: 1,  max: 20,  earns: "one case at F13 or F14" }
    medium:   { min: 21, max: 45,  earns: "case at F14" }
    high:     { min: 46, max: 80,  earns: "case at F15; may not be deferred without Reviewer concurrence" }
    critical: { min: 81, max: 125, earns: "case at F15 AND F16; may not be deferred at all" }
  scores_reviewed_at: F4           # the author does not get the last word on their own risk
  risk_coverage_mandatory_at: [L3, L4]

# ---------------------------------------------------------------------------
# Authorship identity (§9.1.1)
# ---------------------------------------------------------------------------
authorship:
  artifact_author:
    fields: [agent_id, role, session_id, timestamp]
  certifier:
    fields: [agent_id, role, session_id, timestamp]
  rule_identity: "certifier.agent_id != author.agent_id AND certifier.session_id != author.session_id"
  rule_role_and_identity: "identity rule AND certifier.role != author.role AND certifier contributed nothing in any prior session"
  missing_field: FAIL_BEFORE_CHECKLIST
  human_fallback_allowed: true      # single-agent runtimes that cannot produce a distinct session_id

# ---------------------------------------------------------------------------
# Immutable evidence references (§9.1.2)
# ---------------------------------------------------------------------------
evidence:
  required_fields: [claim, command, commit, environment, timestamp, result_file, checksum]
  checksum_algorithm: sha256
  result_files_committed: true
  root: "features/<FEATURE-ID>/evidence/"
  assertion_without_result_file: FAIL

# ---------------------------------------------------------------------------
# Coverage menu (§8.5). Selected per feature, recorded in F5, evidenced at G7.
# ---------------------------------------------------------------------------
coverage_menu:
  - requirement_coverage
  - acceptance_criteria_coverage
  - scenario_coverage
  - branch_coverage
  - decision_coverage
  - state_transition_coverage
  - interface_contract_coverage
  - error_path_coverage
  - risk_coverage
  - regression_coverage

coverage_defaults:
  L0: [acceptance_criteria_coverage]
  L1: [acceptance_criteria_coverage, error_path_coverage]
  L2: [requirement_coverage, acceptance_criteria_coverage, error_path_coverage, interface_contract_coverage]
  L3: [requirement_coverage, acceptance_criteria_coverage, scenario_coverage, state_transition_coverage,
       interface_contract_coverage, error_path_coverage, risk_coverage, regression_coverage]
  L4: [requirement_coverage, acceptance_criteria_coverage, scenario_coverage, state_transition_coverage,
       interface_contract_coverage, error_path_coverage, risk_coverage, regression_coverage, decision_coverage]

# ---------------------------------------------------------------------------
# Environment baseline (§5.1). Every dimension answered; none left "unknown".
# ---------------------------------------------------------------------------
environment_baseline:
  general:
    - vehicle_state
    - ignition_power_state
    - connectivity
    - network_availability
    - location_region
    - user_account_state
    - device_state
    - active_media_source
    - vehicle_configuration_variant
    - software_version
    - hardware_variant
    - language
    - privacy_settings
    - permissions
    - driving_context
    - online_offline
    - time
  audio_specific:
    - active_audio_focus_owner
    - ducking_state
    - mute_state
    - active_zones
    - concurrent_stream_count
    - output_endpoint_set
    - amplifier_or_dsp_variant
    - occupancy_per_seat

operating_conditions: [normal, degraded, unavailable, failure, recovery, interrupted,
                       concurrent, repeated, boundary, misuse, unexpected_sequence]

# ---------------------------------------------------------------------------
# Test surfaces — the F5 environment matrix columns.
# ---------------------------------------------------------------------------
test_surfaces:
  - id: host_unit
    description: "host-side unit test, no vehicle stack"
    levels: [F13]
  - id: service_harness
    description: "audio service with HAL stubbed"
    levels: [F13, F14]
  - id: hal_vacs_loop
    description: "HAL against VACS on a bench target"
    levels: [F14, F15]
  - id: bench_hu
    description: "head unit on bench, real audio path, no vehicle"
    levels: [F14, F15]
  - id: vehicle
    description: "in-vehicle, real occupants and real acoustics"
    levels: [F15, F16]
  - id: backend_stage
    description: "staged backend for account sync"
    levels: [F14, F15]

# ---------------------------------------------------------------------------
# UNBOUND — G4 produces no evidence and G5 cannot be certified until these
# point at real targets. Bind before installing.
# ---------------------------------------------------------------------------
commands:
  build: ""                 # BIND ME
  unit_test: ""             # BIND ME
  integration_test: ""      # BIND ME
  static_analysis: ""       # BIND ME
  coverage: ""              # BIND ME

ui_surface:
  design_system_rules: ""   # BIND ME — G5 checks conformance against this
  accessibility_rules: ""   # BIND ME — G5 checks conformance against this

# ---------------------------------------------------------------------------
# External gates (§15). The lifecycle defers to existing definitions.
# ---------------------------------------------------------------------------
external_gates:
  definitions_location: ""  # BIND ME — authoritative location of existing G1–G6 definitions
  existing:
    G1: { name: "Contract",   owner: existing_framework, lifecycle_supplies: "F7-contracts/, contract baseline" }
    G2: { name: "Impact",     owner: existing_framework, lifecycle_supplies: "F10 forward+reverse, impacted_paths" }
    G3: { name: "Architecture", owner: existing_framework, lifecycle_supplies: "F8, ownership register, concurrency model, reuse records" }
    G4: { name: "Executable", owner: existing_framework, lifecycle_supplies: "F13 evidence with immutable references" }
    G5: { name: "Frontend",   owner: existing_framework, lifecycle_supplies: "UI ACs and design-system conformance record" }
    G6: { name: "Browser/HMI", owner: existing_framework, lifecycle_supplies: "surface verification against AC-*" }
  human:
    H1: { name: "Architecture approval",        lifecycle_hands_over: "F8, F9, alternatives record, G3 + G3.5 ledger entries" }
    H2: { name: "Incompatible contract change", lifecycle_hands_over: "contract diff, baseline supersession, consumer impact set, G1 + G2 ledger entries" }
    H3: { name: "Release approval",             lifecycle_hands_over: "sealed evidence package, G8 Part B recommendation, residual limitations" }
  lifecycle_owns: [G0, "G0.5", "G3.5", G7, G8]
  no_g9: true               # §9.3 — H3 owns the release decision
