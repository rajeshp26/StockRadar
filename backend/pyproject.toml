[project]
requires-python = ">=3.13,<3.14"

# =============================================================================
# Testing
# =============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
# Declared so `-m integration` selects deliberately and the marks stop emitting
# PytestUnknownMarkWarning. An unregistered mark still works, which is why the
# warning was tolerated - but a selection vocabulary nobody declared cannot be
# trusted in CI.
markers = [
    "integration: needs a live stack (database, PostgREST, or network); gated by RUN_INTEGRATION_TESTS=1",
    "data_integrity: asserts an invariant over real data",
    "e2e: exercises a full user-visible flow",
    "browser: proves visible behaviour through a browser driver",
]
# The frozen black-box suite (DID-017) needs a live stack and the harness owns its
# red/green runs; `pytest backend/tests/system` still collects it, because an explicit
# path bypasses this exclusion.
norecursedirs = ["tests/system"]

[tool.coverage.run]
source = ["backend"]
# Only scratch is excluded. Durable tooling under scripts/ is measured: it runs with
# production credentials, so "not application code" was never a reason to leave it
# unmeasured, just a reason nobody looked.
omit = ["tests/*", "scripts/scratch/*", "__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60

# =============================================================================
# Ruff (Linter + Formatter)
# =============================================================================
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "DTZ",    # flake8-datetimez
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["DTZ", "S101"]  # allow assert in tests
"scripts/**/*.py" = ["DTZ"]
"api/**/*.py" = ["B008"]  # FastAPI Depends() in parameter defaults is the documented DI pattern
"__init__.py" = ["F401"]  # allow unused imports

[tool.ruff.lint.isort]
known-first-party = ["backend"]

# =============================================================================
# Black (Formatter)
# =============================================================================
[tool.black]
line-length = 100
target-version = ["py313"]

# =============================================================================
# Mypy (Type Checker)
# =============================================================================
[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual adoption
check_untyped_defs = true
ignore_missing_imports = true
# Deliberate scope, not an oversight: mypy covers the application. Tracked scripts
# are covered by ruff and bandit; only scratch is excluded everywhere.
exclude = [
    "tests/",
    "scripts/",
    "__pycache__/",
    "venv/",
    ".venv/",
]

# =============================================================================
# Bandit (Security Scanner)
# =============================================================================
[tool.bandit]
# Scratch is the only exclusion, for the same reason as coverage: tracked scripts
# run against real credentials and deserve a security scan.
exclude_dirs = ["tests", "scripts/scratch", "venv", ".venv"]
skips = ["B101"]  # allow assert in non-test code
