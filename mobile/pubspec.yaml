name: stockerpro
description: StockerPro Mobile - Portfolio & Watchlist Tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Networking
  dio: ^5.4.0
  connectivity_plus: ^6.0.3
  
  # Firebase (Standardized for 3.22+ compatibility)
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  firebase_analytics: ^11.0.0
  firebase_crashlytics: ^4.0.0
  
  # JSON & Code Gen
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  
  # Routing
  go_router: ^14.0.0
  
  # UI/UX & Utilities
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  logger: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  build_runner: ^2.4.10
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
