states:
  activeZoneOffset:
    owner: CMP-02
    readers: [CMP-01, CMP-02]
    writers: [CMP-02]
    persistence: CMP-05
    synchronization: EVT-1
    control_scope: seat
    concurrency:
      consistency_model: "single-writer sequential consistency within CMP-02"
      serialization_mechanism: "per-zone command queue"
      conflict_resolution: "driver precedence, then queue arrival order"
      deterministic_winner: "requesterRole == driver wins; ties by total per-zone arrival sequence"
      ordering: "per-zone FIFO after precedence"
      atomicity: "store-then-apply; failed apply does not report Applied"
      race_prevention: "no shared mutable offset outside CMP-02"
      reentrancy: "non-reentrant handler; nested call rejected APPLY_FAILED"
      thread_safety: "one dispatch thread per zone queue; repository I/O off-thread, result posted back"

