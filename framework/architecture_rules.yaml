# Declared architecture boundaries, checked by G3. Edit to match your repository.
#
# Paths are repo-relative and are matched as PREFIXES of the changed file, so a boundary is
# declared against the directory that owns the code. These describe this repository's two
# projects: the Next.js application under `web/` and the Python service under `backend/`.
# The framework itself lives in `framework/` and is judged by its own gates.
#
# Keep a rule only while it is true. A boundary that the code already violates turns G3 into
# noise on the next unrelated change, which is how a declared rule stops being enforced.
forbidden_imports:
  # The browser application must not reach into the Python service's source tree, and must
  # not take a Python persistence dependency.
  - from: web/
    must_not_import: ["backend/", "sqlalchemy", "psycopg"]
  # The domain layer is pure: no transport framework, no persistence client, no HTTP calls.
  # `backend/application/` is deliberately NOT constrained to this list -- it legitimately
  # translates domain errors into HTTP responses (measured: it imports fastapi).
  - from: backend/domain/
    must_not_import: ["fastapi", "starlette", "supabase", "requests", "httpx", "psycopg",
                      "sqlalchemy"]

layer_order: [domain, application, infrastructure, interface]
notes: >
  Boundaries are declared, never inferred. A rule that is not written here is not enforced.
