# Tool Registry — AUTHORITATIVE
#
# Semantic metadata for every tool available to agents. The registry answers:
#   - What can this tool do?
#   - When should it be used?
#   - When should it NOT be used?
#   - What evidence does it produce?
#
# Agents MUST consult this registry before performing work. The Tool Applicability
# Analysis in team-lead.md references this file as the source of tool knowledge.
#
# Adding a new tool: add an entry here with purpose, capabilities, use_when,
# do_not_use_when, evidence_type, and required_by fields.

tools:

  # ── Code Intelligence ──────────────────────────────────────────────────────

  codegraph:
    purpose: Codebase structural understanding — symbols, call paths, blast radius
    capabilities:
      - symbol_lookup
      - call_path_tracing
      - blast_radius_analysis
      - dependency_mapping
    use_when:
      - unfamiliar codebase
      - architecture investigation
      - change impact analysis
      - finding callers/callees
      - understanding module boundaries
    do_not_use_when:
      - simple file reads (use read tool)
      - config file inspection (use read tool)
    evidence_type: structural_query
    required_by: [architect, implementer, reviewer]

  lsp:
    purpose: Language server intelligence — diagnostics, references, definitions, renames
    capabilities:
      - diagnostics
      - find_references
      - goto_definition
      - rename
      - document_symbols
      - workspace_symbols
    use_when:
      - type checking
      - finding all references before refactor
      - validating renames
      - understanding type hierarchies
    do_not_use_when:
      - non-indexed languages
      - simple text searches (use grep)
    evidence_type: diagnostics_and_references
    required_by: [implementer, reviewer, verifier]

  # ── File Operations ────────────────────────────────────────────────────────

  filesystem:
    purpose: Read, write, edit, search files and directories
    capabilities:
      - read_files
      - write_files
      - edit_files
      - glob_pattern_matching
      - content_search
    use_when:
      - any file operation
      - code inspection
      - configuration changes
    do_not_use_when:
      - structural code analysis (use codegraph)
    evidence_type: file_content
    required_by: [all_agents]

  grep:
    purpose: Fast content search across files using regex patterns
    capabilities:
      - regex_search
      - file_filtering
      - match_counting
    use_when:
      - finding specific patterns in code
      - locating configuration values
      - searching for string literals
    do_not_use_when:
      - structural code analysis (use codegraph)
      - simple file reads (use read)
    evidence_type: search_matches
    required_by: [all_agents]

  # ── External Research ──────────────────────────────────────────────────────

  context7:
    purpose: Up-to-date documentation and code examples for libraries/frameworks
    capabilities:
      - library_documentation
      - api_reference
      - code_examples
      - version_specific_docs
    use_when:
      - unfamiliar library APIs
      - framework feature lookup
      - version migration guidance
      - library-specific debugging
    do_not_use_when:
      - refactoring existing code
      - writing scripts from scratch
      - debugging business logic
    evidence_type: documentation_reference
    required_by: [researcher, implementer]

  websearch:
    purpose: Real-time web search for current information
    capabilities:
      - web_search
      - content_scraping
      - news_lookup
    use_when:
      - current events
      - recent documentation
      - external API documentation
      - community solutions
    do_not_use_when:
      - internal codebase questions (use codegraph/grep)
      - library docs (use context7)
    evidence_type: web_reference
    required_by: [researcher]

  github_search:
    purpose: Search real-world code examples from public GitHub repositories
    capabilities:
      - code_pattern_search
      - repo_filtering
      - language_filtering
    use_when:
      - finding implementation examples
      - understanding library usage patterns
      - battle-tested patterns
    do_not_use_when:
      - internal codebase (use codegraph/grep)
      - documentation lookup (use context7)
    evidence_type: code_example
    required_by: [researcher, implementer]

  # ── Browser Automation ─────────────────────────────────────────────────────

  playwright:
    purpose: Browser automation for UI verification and interaction
    capabilities:
      - navigate
      - interact
      - screenshot
      - inspect
      - verify
      - console_monitoring
      - responsive_testing
    use_when:
      - frontend behavior verification
      - browser interaction testing
      - visual UI verification
      - responsive layout testing
      - console error checking
    do_not_use_when:
      - backend-only logic
      - API testing (use API tools)
      - unit testing (use test runner)
    evidence_type: browser_screenshot_and_trace
    required_by: [verifier]

  # ── Memory / Knowledge ────────────────────────────────────────────────────

  memory:
    purpose: Knowledge graph for persistent entity/relation storage
    capabilities:
      - entity_creation
      - relation_tracking
      - observation_management
      - graph_query
    use_when:
      - cross-session context
      - entity relationship tracking
      - knowledge accumulation
    do_not_use_when:
      - temporary state (use variables)
      - file-based state (use filesystem)
    evidence_type: graph_state
    required_by: [all_agents]

  # ── GSD State ──────────────────────────────────────────────────────────────

  gsd:
    purpose: GSD state management — phases, plans, tasks, blockers, verification
    capabilities:
      - phase_management
      - task_tracking
      - blocker_escalation
      - verification_recording
      - research_output
    use_when:
      - any lifecycle operation
      - task state changes
      - blocker recording
      - verification evidence
    do_not_use_when:
      - direct code changes (use filesystem)
    evidence_type: state_change
    required_by: [all_agents]

  # ── Session Management ─────────────────────────────────────────────────────

  sessions:
    purpose: OpenCode session history and context management
    capabilities:
      - session_listing
      - message_reading
      - content_search
      - context_restoration
    use_when:
      - resuming previous work
      - searching past decisions
      - understanding conversation history
    do_not_use_when:
      - current task execution
      - code changes
    evidence_type: session_reference
    required_by: [all_agents]

  # ── Build / Test ───────────────────────────────────────────────────────────

  terminal:
    purpose: Execute shell commands for build, test, lint, and verification
    capabilities:
      - build_execution
      - test_running
      - lint_checking
      - type_checking
      - git_operations
    use_when:
      - running tests
      - building project
      - linting code
      - type checking
      - git operations
    do_not_use_when:
      - file reading (use read)
      - code search (use grep/codegraph)
    evidence_type: command_output_and_exit_code
    required_by: [implementer, verifier]

  # ── GitHub ─────────────────────────────────────────────────────────────────

  github:
    purpose: GitHub API operations — PRs, issues, checks, releases
    capabilities:
      - pr_management
      - issue_tracking
      - check_status
      - release_management
    use_when:
      - creating PRs
      - reviewing issues
      - checking CI status
      - managing releases
    do_not_use_when:
      - local git operations (use terminal)
    evidence_type: github_api_response
    required_by: [team_lead, implementer]

# ── Capability Matrix ──────────────────────────────────────────────────────────
# Maps activities to tool requirements. Used by Tool Applicability Analysis.

capability_matrix:

  understand_unfamiliar_code:
    tools: [codegraph, grep, filesystem]
    requirement: required
    notes: Start with codegraph for structural overview, grep for specific patterns

  find_references:
    tools: [lsp, codegraph, grep]
    requirement: required
    notes: lsp for type-aware references, codegraph for call paths, grep for text

  dependency_analysis:
    tools: [codegraph, lsp]
    requirement: when_applicable
    notes: codegraph for symbol dependencies, lsp for import analysis

  documentation_lookup:
    tools: [context7, websearch]
    requirement: when_applicable
    notes: context7 for library docs, websearch for external resources

  git_history:
    tools: [terminal]
    requirement: when_applicable
    notes: git log, git blame, git bisect

  browser_behavior:
    tools: [playwright]
    requirement: required
    notes: Mandatory for frontend verification

  visual_verification:
    tools: [playwright]
    requirement: required
    notes: Screenshots and DOM inspection

  api_testing:
    tools: [terminal, playwright]
    requirement: when_applicable
    notes: curl for simple API tests, playwright for complex flows

  database_inspection:
    tools: [terminal]
    requirement: when_applicable
    notes: Database CLI tools

  build_and_test:
    tools: [terminal]
    requirement: required
    notes: npm/pnpm/yarn for JS, pytest for Python, etc.

  gsd_state:
    tools: [gsd]
    requirement: required
    notes: Phase management, task tracking, verification

  external_research:
    tools: [websearch, github_search, context7]
    requirement: when_required
    notes: For external library/API research

# ── Tool Selection Rules ───────────────────────────────────────────────────────
# Rules for selecting the right tool based on context.

selection_rules:

  - rule: prefer_structural_over_text
    description: When analyzing code structure, prefer codegraph over grep
    reason: codegraph provides call paths and blast radius that grep cannot

  - rule: prefer_lsp_over_grep_for_references
    description: When finding code references, prefer LSP over grep
    reason: LSP provides type-aware references including imports and overrides

  - rule: prefer_context7_over_websearch_for_docs
    description: When looking up library documentation, prefer context7 over websearch
    reason: context7 provides version-specific, indexed documentation

  - rule: mandatory_browser_for_frontend
    description: Frontend behavior verification MUST use playwright
    reason: Unit tests cannot prove visible behavior

  - rule: mandatory_evidence_for_verification
    description: Verification claims MUST be backed by tool output
    reason: Opinions are not evidence; exit codes and artifacts are

  - rule: tool_output_over_assumption
    description: When a tool can provide information, never assume
    reason: Assumptions are the source of escaped defects
