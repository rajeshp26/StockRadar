# Frontend stack contract. Checked by G5 (framework/frontend/stack_check.py).
# A stack rule that is not written here is NOT enforced. Same principle as architecture_rules.yaml.

# Files considered "frontend" for stack purposes.
#
# These are DEFAULTS, expressed relative to the frontend manifest's directory (the binding
# in framework.config.json -> readiness.frontend_manifest). A manifest at `web/package.json`
# therefore turns `src/frontend/**` into `web/src/frontend/**`. An app whose layout differs
# (Next.js `src/app/**`) declares `readiness.frontend_globs` instead of relying on a guess --
# framework/locate.py resolves it, and a guess would judge the wrong files.
frontend_globs: ["src/frontend/**/*.tsx", "src/frontend/**/*.ts", "src/frontend/**/*.css"]

# Directories exempt from primitive rules: this is where shadcn primitives legitimately
# wrap raw elements. Generated by `shadcn add`, not hand-authored. Relative to the frontend
# manifest's directory, same as frontend_globs; `readiness.primitive_dirs` overrides.
primitive_dirs: ["src/frontend/components/ui/"]

tiers:
  required:
    # Enforced. A changed frontend file that violates these fails G5.
    - concern: standard_ui_component
      tool: shadcn/ui
      marker_file: components.json
      forbidden_alternates: ["@mui/material", "antd", "react-bootstrap", "@chakra-ui/react", "@radix-ui/themes"]
    - concern: styling
      tool: tailwindcss
      package: tailwindcss
      forbidden_alternates: ["styled-components", "@emotion/styled", "@emotion/react", "sass", "node-sass", "less"]
    - concern: icons
      tool: lucide
      package: lucide-react
      forbidden_alternates: ["react-icons", "@heroicons/react", "@mui/icons-material", "phosphor-react", "react-feather"]
    - concern: animation
      tool: motion
      package: motion
      import_path: motion/react
      # framer-motion still resolves but is the deprecated alias; the project standardises on motion.
      forbidden_alternates: ["framer-motion", "react-spring", "@react-spring/web", "animejs"]
    - concern: browser_testing
      tool: playwright
      package: "@playwright/test"
      forbidden_alternates: ["cypress", "selenium-webdriver", "puppeteer"]
    - concern: responsive_validation
      tool: playwright
      mechanism: projects_with_viewports
      min_viewports: 2

  conditional:
    # Allowed only with a recorded justification. See framework/frontend/effect_justifications.yaml.
    - concern: premium_visual_effect
      tool: Magic UI
      packages: ["magicui", "@magicui/react"]
      import_markers: ["components/magicui/", "magicui"]
      requires: justification
    - concern: complex_visual_effect
      tool: Aceternity
      packages: ["aceternity", "@aceternity/ui"]
      import_markers: ["components/aceternity/", "aceternity"]
      requires: justification
    - concern: complex_timeline_animation
      tool: GSAP
      packages: ["gsap", "@gsap/react"]
      requires: justification
      extra_fields: [motion_insufficient_because]   # GSAP is only allowed when Motion cannot do it
    - concern: three_dimensional
      tool: React Three Fiber
      packages: ["@react-three/fiber", "@react-three/drei", "three"]
      requires: justification

# Mechanical per-file rules applied to CHANGED frontend files only (ratchet).
file_rules:
  - id: no_inline_style
    pattern: 'style=\{\{'
    message: "inline style object; use Tailwind utility classes"
    escape_hatch: "stack-allow: inline-style"
  - id: no_raw_interactive
    pattern: '<(button|input|select|textarea|dialog)[\s>]'
    message: "raw interactive element; use the shadcn/ui primitive"
    exempt_dirs_key: primitive_dirs
    escape_hatch: "stack-allow: raw-element"
  - id: no_inline_svg_icon
    pattern: '<svg[\s>]'
    message: "inline SVG; use a lucide-react icon"
    exempt_dirs_key: primitive_dirs
    escape_hatch: "stack-allow: inline-svg"
  - id: motion_import_path
    pattern: 'from\s+["\x27]framer-motion["\x27]'
    message: "import from motion/react, not framer-motion"
    escape_hatch: null

shadcn_config:
  require_icon_library: lucide
  # Tailwind v4: components.json tailwind.config must be empty.
  require_empty_tailwind_config: true

enforcement:
  mode: ratchet
  rationale: >
    Required tools are enforced executably, but only on files changed by the current task.
    Pre-existing violations are recorded as baseline debt and reported, never used to block
    unrelated work. This keeps the rule a real gate on a brownfield repository instead of a
    permanent red light that teams learn to ignore.
  baseline_file: framework/frontend/baseline.json
