# Verifier profiles. Activated by the change impact class, not by agent count.
profiles:
  functional:
    always: true
    evidence: [unit_test, integration_test]
    commands: ["./framework/gates/g4_executable.sh", "./framework/gates/g8_blockers.sh", "./framework/gates/g9_scope.sh", "./framework/gates/g11_evidence.sh", "./framework/gates/g14_integrity.sh", "./framework/gates/g16_state_health.sh"]

  contract:
    when: {contract_change: true}
    evidence: [contract_test, generated_type_diff]
    commands: ["./framework/gates/g1_contract.sh"]

  browser:
    when: {requirement_shape: visible_behaviour}
    evidence: [screenshot, dom_inspection, console_output]
    sequence: [build, start, navigate, interact, read_console, capture, assert]
    on_missing_driver: report_unverifiable   # never report pass
    # exit 0 pass | 1 fail | 3 UNVERIFIABLE. 3 is not 0: "could not look" != "looks right".
    commands: ["./framework/gates/g6_browser.sh"]
    mandatory_for: [visual_alignment, interaction_flow, responsive_behaviour]

  frontend_stack:
    when: {frontend_files_changed: true}
    evidence: [stack_conformance_exit_code]
    commands: ["./framework/gates/g5_frontend_stack.sh"]
    enforcement: ratchet   # judges changed files only; baseline debt is reported, not blocking

  security:
    when: {security_sensitive: true}
    evidence: [dependency_scan, authz_integration_test, secret_scan, permission_policy_invariants]
    commands: ["npm audit --audit-level=high", "pip-audit", "./framework/gates/g10_permission.sh"]

  performance:
    when: {scope: [cross_component, system], hot_path: true}
    evidence: [measured_benchmark]
    commands: []

  retro:
    when: {defect_escaped: true}
    evidence: [escape_path_analysis, ledger_entry, fix_verification_exit_code]
    commands: ["./framework/gates/g7_retro.sh"]
    # Runs on escape, not on every task. An escape is a defect found after the change that
    # introduced it was accepted: a previously-green test failing, a review rejection, a
    # reopened task, a production defect.
    on_recurrence: escalate_to_human   # 2nd occurrence of a signature means the fix failed

  release:
    when: {data_change: true, or_deployment_affected: true}
    evidence: [build_artifact, migration_applied_and_rolled_back, config_validated]
    commands: []
    human_gate: H3

# g5 = frontend stack conformance, g6 = browser verification.
# g6 is appended by the Verifier whenever a requirement's shape is visible_behaviour,
# regardless of impact class — a local CSS change can still break visible behaviour.
impact_to_gates:
  local:            [g2, g4, g9]
  component:        [g2, g4, g5, g9]
  cross_component:  [g1, g2, g3, g4, g5, g9]
  system:           [g1, g2, g3, g4, g5, g9]

shape_to_gates:
  visible_behaviour: [g6]

# g7 is triggered by an EVENT, not by impact class or requirement shape. A defect escape can
# follow any classification, so it cannot be routed from impact_to_gates.
event_to_gates:
  defect_escaped: [g7]

# Risk signals route to gates by SIGNAL, not by impact class. A signal is a routing input the
# Team Lead records at dispatch time (e.g. "unfamiliar dependency", "boundary ambiguity").
# impact_to_gates still decides breadth; risk_signal_to_gates decides WHICH checks a specific
# signal invokes when shape and impact alone would not reach them. A fired signal with no gate
# is a routing gap, not a silence: record it as a claim, then route.
risk_signal_to_gates:
  visible_behaviour:      [g6]
  frontend_files_changed: [g5]
  security_sensitive:     [g10]
  contract_change:        [g1]
  scope_uncertainty:      [g2, g9]
  unfamiliar_dependency:  [g4, g5]
  no_plan_context:        [g_entry]

# Exemption recording (D): when a fired signal's gate does not run, the reason is written to
# the verification artifact naming the signal. A waiver with no record is a routing gap, not a
# pass. There is no silent exemption - only recorded ones.
