# Evidence classes -- the ONLY translation from an acceptance-criterion tag to a
# verification method, the gates that produce its evidence, the skills that own it,
# and whether it exercises the real stack.
#
# WHY THIS FILE EXISTS
# ====================
# The chain impact -> criterion -> skill -> gate -> evidence had five nodes and no
# artifact carrying the decision between them. The evidence-tag vocabulary was copied
# four times with no canonical copy:
#
#   framework/plan/plan_lint.py        EVIDENCE_TAGS, REAL_TAGS
#   framework/tools/evidence_level.py  REAL_STACK_TAGS
#   framework/testing/system_test_lint.py  REAL_TAGS
#
# so a plan could declare `AC-1 [e2e]` and nothing downstream ever asked whether that
# criterion had evidence. This file is the canonical copy. `framework/verifier/evidence.py`
# is its only reader; `validate.py` proves the legacy copies still equal it.
#
# ADDING A CLASS
# ==============
# Add the row, then add the gate's EXIT_CODES.md row and its `framework/gates/g<N>_*.sh`.
# `validate.py` fails if a class names a gate with no implementation, so the table cannot
# describe a check that does not exist.
#
# A class with `gates: []` is deliberately unverifiable by a gate (manual review). It is
# allowed, but `matrix.py check` refuses completion on a `manual` row unless a human
# waives it -- reasoning is not evidence (AGENTS.md > Evidence).

classes:
  unit:
    method: unit_test
    gates: [g4]
    skills: [unit-test-authoring]
    real_stack: false

  contract:
    method: contract_test
    gates: [g1]
    skills: [contract-authoring]
    real_stack: false

  static:
    method: static_check
    gates: [g4]
    skills: []
    real_stack: false

  integration:
    method: system_test
    gates: [g17]
    skills: [system-test-authoring]
    real_stack: true

  e2e:
    method: system_test
    gates: [g17]
    skills: [system-test-authoring]
    real_stack: true

  browser:
    # g6 proves the visible behaviour; g17 proves the stack was real. A browser claim
    # that only ran against a mocked backend is the defect this pairing exists to catch.
    method: browser_check
    gates: [g6, g17]
    skills: [browser-verification, system-test-authoring]
    real_stack: true

  data-invariant:
    method: system_test
    gates: [g17]
    skills: [system-test-authoring]
    real_stack: true

  manual:
    # No gate can execute judgement. Allowed as a declared class so a plan does not lie
    # about its evidence type; completion requires an explicit human waiver.
    method: human_review
    gates: []
    skills: []
    real_stack: false
