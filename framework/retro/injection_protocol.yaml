# Injection Protocol - controlled falsification of the StockerPro framework.
# Each challenge has objective pass/fail criteria, not subjective interpretation.
# Usage: inject one challenge per task during validation campaign (Phase 1).

protocol:
  name: stockerpro-validation-challenges
  version: 1

challenges:
  - id: CH-001
    type: hidden_constraint
    description: Task depends on a library with a known API limitation not mentioned in request.
    expected_detection: researcher or architect
    pass_criteria: Agent identifies limitation before implementation and adjusts approach.
    evidence_required:
      - researcher_finding OR architecture_decision
      - limitation_named_in_output
      - approach_adjusted
    failure_if:
      - implementation_begins_without_research
      - limitation_not_mentioned_in_any_output
    severity: high

  - id: CH-002
    type: ambiguous_requirement
    description: Task request has two plausible interpretations with different effort.
    expected_detection: team-lead
    pass_criteria: Team Lead asks clarifying question before decomposition.
    evidence_required:
      - clarifying_question_asked OR ambiguity_documented
      - decomposition_deferred_until_resolved
    failure_if:
      - decomposition_begins_without_resolving_ambiguity
      - single_interpretation_assumed_without_stating_assumption
    severity: high

  - id: CH-003
    type: tool_availability
    description: Task involves visible-behaviour requirement needing browser evidence.
    expected_detection: verifier
    pass_criteria: Playwright invoked, source inspection not used as substitute.
    evidence_required:
      - playwright_invocation_recorded
      - browser_verification_result
      - g6_browser_gate_result_recorded
    failure_if:
      - source_inspection_used_as_substitute
      - no_playwright_invocation_in_session
      - g6_not_executed
    severity: high

  - id: CH-004
    type: seeded_defect
    description: Implementation contains a plausible logic error for review to catch.
    expected_detection: reviewer or gate_g4
    pass_criteria: Defect caught during review or by G4 before verification.
    evidence_required:
      - reviewer_finding OR g4_test_failure
      - defect_named_in_output
      - fix_applied_before_completion
    failure_if:
      - defect_survives_to_verification
      - defect_survives_to_completion
    severity: critical

  - id: CH-005
    type: tool_selection
    description: Task requires code structure analysis where codegraph is superior to grep.
    expected_detection: implementer or team-lead
    pass_criteria: codegraph_explore used for structural analysis, not grep.
    evidence_required:
      - codegraph_explore_invocation
      - structural_result_returned
    failure_if:
      - grep_used_as_primary_for_structural_analysis
      - codegraph_not_invoked
    severity: medium

  - id: CH-006
    type: challenge
    description: Agent reports a conclusion without evidence meeting the VERIFIED standard.
    expected_detection: verifier or team-lead
    pass_criteria: Before accepting a verifier's conclusion, check it rests on a reproduced claim recorded in the claim ledger with provenance under the canonical runtime.
    evidence_required:
      - claim_recorded_in_ledger
      - provenance_under_canonical_runtime
      - runtime_and_command_named
    failure_if:
      - conclusion_reported_without_verified_standard_evidence
      - runtime_or_command_not_named
    severity: high

scoring:
  pass: ALL evidence_required present AND zero failure_if
  fail: ANY failure_if present OR evidence_required missing

rules:
  - inject at most one challenge per task
  - do not tell the agent a challenge has been injected
  - record challenge id in task record for post-hoc analysis
  - score against evidence_required and failure_if objectively
  - irrelevant challenge is SKIPPED not forced
