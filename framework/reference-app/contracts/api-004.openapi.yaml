openapi: 3.0.3
info:
  title: Auth Token Refresh
  version: "2"
  description: |
    Contract API-004. Owner architect. Consumers frontend, backend.
    This file is the source of truth for the /auth/refresh boundary.
    Changing it is a contract change, not an implementation detail.

paths:
  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Exchange a refresh token for a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Refresh token invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    RefreshRequest:
      type: object
      required: [refresh_token]
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 20
        device_id:
          type: string

    RefreshResponse:
      type: object
      required: [access_token, expires_in, token_type]
      additionalProperties: false
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          minimum: 1
        token_type:
          type: string
          enum: [Bearer]
        refresh_token:
          type: string

    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
